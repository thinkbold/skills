name: Validate and release skills

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "assess-ontario-tenant-application-v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        env:
          PYTHONPATH: plugins/assess-ontario-tenant-application/skills/assess-ontario-tenant-application
        run: >-
          python -m unittest discover
          -s plugins/assess-ontario-tenant-application/tests
          -v

      - name: Compile bundled scripts
        run: python -m compileall -q plugins/assess-ontario-tenant-application/skills/assess-ontario-tenant-application/scripts

      - name: Validate JSON files
        run: >-
          find .agents/plugins plugins/assess-ontario-tenant-application
          -name '*.json' -type f -print0
          | xargs -0 -n1 python -m json.tool
          > /dev/null

  distribution:
    name: Validate installer discovery
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify the skills CLI discovers the bundle
        env:
          DISABLE_TELEMETRY: "1"
        run: npx --yes skills add . --list

  release:
    name: Package tagged release
    if: startsWith(github.ref, 'refs/tags/assess-ontario-tenant-application-v')
    needs:
      - validate
      - distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Build versioned skill archive
        run: |
          mkdir -p dist
          tar -czf \
            "$GITHUB_WORKSPACE/dist/assess-ontario-tenant-application.tar.gz" \
            -C plugins/assess-ontario-tenant-application/skills \
            assess-ontario-tenant-application
          sha256sum \
            dist/assess-ontario-tenant-application.tar.gz \
            > dist/assess-ontario-tenant-application.tar.gz.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/assess-ontario-tenant-application.tar.gz
          dist/assess-ontario-tenant-application.tar.gz.sha256
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
